[project]
name = "desktopai-hadali"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai",
    "live2d-py",
    "pyside6",
    "pyopengl",
    "numpy",
    "edge-tts>=7.2.8",
    "sounddevice>=0.5.6",
    "dashscope>=1.27.1",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.0",
]

# 国内镜像源配置（替换默认源）
[tool.uv]

# 设置默认镜像源（优先从这里下载）
index-url = "https://pypi.tuna.tsinghua.edu.cn/simple/"

# 添加备用镜像源（如阿里云，防止单一源故障）
[[tool.uv.index]]
name = "aliyun"
url = "https://mirrors.aliyun.com/pypi/simple/"
